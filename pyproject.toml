[project]
name = "pixels-to-patients"
version = "1.0.0"
description = "From Pixels to Patients: a guided tour of attribution methods on lung CT"
readme = "README.md"
requires-python = ">=3.10"
# Direct imports of the four scripts under scripts/. nnunetv2, batchgenerators
# and segcls_ensemble_infer are NOT listed: they come from the JSC editable
# install, which also needs two local patches — see docs/jsc-luna25-sources.md.
dependencies = [
    "matplotlib>=3.10",
    "monai>=1.3",
    "numpy>=2.2",
    "pillow>=12",
    "requests>=2.32",
    "scikit-image>=0.25",
    "scipy>=1.15",
    "simpleitk>=2.5",
    "torch>=2.12",
    "torchmetrics>=1.9",
]

# Not an installable package — this repository is a website plus a handful of
# scripts, so uv treats it as an environment manifest only.
[tool.uv]
package = false
